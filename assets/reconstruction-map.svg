<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 588" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The finite-contact reconstruction: one one-use floor, three published lines, ending in the Chapter 8 state/receiver closure where the Born rule and contextuality meet.">
  <style>
    text{fill:#111418}
    .mut{fill:#5b6470}
    .bg{fill:#ffffff}
    .card{fill:#f4f6f8;stroke:#c6ccd4;stroke-width:1.2}
    .q{fill:#e6f0fb;stroke:#0b5cad;stroke-width:1.3}
    .e{fill:#e6f4ee;stroke:#0b6b52;stroke-width:1.3}
    .c{fill:#f1e9f9;stroke:#7a3fb0;stroke-width:1.3}
    .edge{stroke:#aeb6bf;stroke-width:1.5;fill:none}
    .floor{fill:#1f2937;stroke:none}
    .ftext{fill:#f7fafc}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}.mut{fill:#9aa5b1}.bg{fill:#0d1117}
      .card{fill:#161b22;stroke:#30363d}
      .q{fill:#10233a;stroke:#5aa9f0}.e{fill:#0f2a22;stroke:#3fbf98}.c{fill:#241733;stroke:#c194e6}
      .edge{stroke:#3d444d}.floor{fill:#e6edf3}.ftext{fill:#0d1117}
    }
  </style>
  <rect class="bg" x="0" y="0" width="900" height="588"/>

  <text x="40" y="40" font-size="22" font-weight="700">Finite Contact Theory &#8212; the reconstruction</text>
  <text class="mut" x="40" y="63" font-size="13">One one-use floor. Three published lines. Every rung is a runnable theorem, a named recovery, a scoped model result, or a logged failure.</text>

  <!-- floor -->
  <rect class="floor" x="330" y="88" width="240" height="48" rx="10"/>
  <text x="450" y="110" text-anchor="middle" font-size="15" font-weight="700" class="ftext">finite one-use contact floor</text>
  <text x="450" y="127" text-anchor="middle" font-size="10.5" class="ftext" opacity="0.82">a mark, made once, leaving a difference it cannot erase</text>

  <!-- floor -> line cards (top-centers at x = 170, 450, 730; y = 185) -->
  <path class="edge" d="M450 136 L170 185"/>
  <path class="edge" d="M450 136 L450 185"/>
  <path class="edge" d="M450 136 L730 185"/>

  <!-- line 1: quantum-facing -->
  <rect class="q" x="40" y="185" width="260" height="180" rx="10"/>
  <text x="170" y="211" text-anchor="middle" font-size="13.5" font-weight="700">Quantum-facing axis</text>
  <text class="mut" x="58" y="238" font-size="11">counting, one-receiver gluing</text>
  <text class="mut" x="58" y="258" font-size="11">rational Born weights</text>
  <text class="mut" x="58" y="278" font-size="11">CHSH/Pell boundary -&gt; 2 sqrt2</text>
  <text class="mut" x="58" y="298" font-size="11">native carrier grammar</text>
  <text class="mut" x="58" y="318" font-size="11">exact preparation gap</text>
  <text class="mut" x="58" y="348" font-size="9.5" font-weight="700">Chapters 1-2 &#183; THEOREM (scoped)</text>

  <!-- line 2: finite-epistemics -->
  <rect class="e" x="320" y="185" width="260" height="180" rx="10"/>
  <text x="450" y="211" text-anchor="middle" font-size="13.5" font-weight="700">Finite-epistemics axis</text>
  <text class="mut" x="338" y="238" font-size="11">identifiability + log2(m) debt</text>
  <text class="mut" x="338" y="258" font-size="11">inquiry calculus, EC = H+KL+O</text>
  <text class="mut" x="338" y="278" font-size="11">four theorems on time</text>
  <text class="mut" x="338" y="298" font-size="11">no derivable &#8220;now&#8221;</text>
  <text class="mut" x="338" y="318" font-size="11">a measured generative floor</text>
  <text class="mut" x="338" y="348" font-size="9.5" font-weight="700">Chapters 3-6 &#183; THEOREM / MEASURED</text>

  <!-- line 3: contact-interface -->
  <rect class="c" x="600" y="185" width="260" height="180" rx="10"/>
  <text x="730" y="211" text-anchor="middle" font-size="13.5" font-weight="700">Contact-interface line</text>
  <text class="mut" x="618" y="238" font-size="11">non-exact return -&gt; H receiver</text>
  <text class="mut" x="618" y="258" font-size="11">24-cell &lt;-&gt; dual 24-cell</text>
  <text class="mut" x="618" y="278" font-size="11">F4 closure (|W| = 1152)</text>
  <text class="mut" x="618" y="298" font-size="11">forced overlap ratio 1/2</text>
  <text class="mut" x="618" y="318" font-size="11">finite Gleason + triality KS</text>
  <text class="mut" x="618" y="348" font-size="9.5" font-weight="700">Chapter 8 (v0.8) &#183; MODEL-SCOPE</text>

  <!-- line cards -> closure (bottom-centers at y = 365; closure top-center 450,404) -->
  <path class="edge" d="M170 365 L450 404"/>
  <path class="edge" d="M450 365 L450 404"/>
  <path class="edge" d="M730 365 L450 404"/>

  <!-- the closure -->
  <rect class="card" x="210" y="404" width="480" height="76" rx="12"/>
  <text x="450" y="431" text-anchor="middle" font-size="14.5" font-weight="700">the state / receiver closure</text>
  <text class="mut" x="450" y="452" text-anchor="middle" font-size="11.5">Born valuation forced by a finite Gleason theorem &#8212;</text>
  <text class="mut" x="450" y="469" text-anchor="middle" font-size="11.5">exactly where triality Kochen-Specker forbids a global pointing</text>

  <!-- the sentence -->
  <rect class="card" x="120" y="506" width="660" height="58" rx="10" fill="none"/>
  <text x="450" y="530" text-anchor="middle" font-size="12.5" font-weight="700">&#8220;The valuation is uniquely lawful exactly where a global pointing is impossible.&#8221;</text>
  <text class="mut" x="450" y="549" text-anchor="middle" font-size="10">Born and contextuality are two faces of one finite closure. Scope: a real-quantum cell; more is held open by name.</text>
</svg>
