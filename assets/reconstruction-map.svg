<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="The finite-contact reconstruction map: from the one-use floor, six lines of results rise — the quantum axis, finite epistemics, the interface reconstruction, the atlas and ladder, the counting grammar, and the ledger frame — meeting the hosted-observer layer, above which sit the two worlds the observer forces: space and chance. The registered divergence seam rises from the counting grammar past every layer, pointing beyond quantum mechanics.">
  <defs>
    <style>
      .t   { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .ttl { fill:#e8edf6; font-size:26px; font-weight:700; letter-spacing:3px; }
      .sub { fill:#8fa3c0; font-size:13.5px; }
      .h   { fill:#dbe4f2; font-size:14.5px; font-weight:650; }
      .b   { fill:#a8b8d0; font-size:12px; }
      .s   { fill:#7d90ad; font-size:11px; }
      .fl  { fill:#cfe6e2; font-size:14px; font-weight:650; letter-spacing:1px; }
      .flb { fill:#93b5b0; font-size:12px; }
      .ob  { fill:#d9f2ec; font-size:15px; font-weight:700; letter-spacing:1.5px; }
      .obb { fill:#9ccfc4; font-size:12px; }
      .sp  { fill:#d7e6f7; font-size:15px; font-weight:700; letter-spacing:1.5px; }
      .spb { fill:#9db9d8; font-size:12px; }
      .dv  { fill:#f2d29b; font-size:13.5px; font-weight:700; letter-spacing:1px; }
      .dvb { fill:#d9b87c; font-size:11.5px; }
    </style>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="3" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#41546f"/>
    </marker>
    <marker id="upT" viewBox="0 0 10 10" refX="5" refY="3" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#3d7a6e"/>
    </marker>
    <marker id="upB" viewBox="0 0 10 10" refX="5" refY="3" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#5b8fb8"/>
    </marker>
    <marker id="upA" viewBox="0 0 10 10" refX="5" refY="3" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 10 L 5 0 L 10 10 z" fill="#c9a35e"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="798" rx="18" fill="#0e1726" stroke="#24344d" stroke-width="2"/>

  <!-- header -->
  <text x="60" y="54" class="t ttl">FINITE CONTACT THEORY</text>
  <text x="60" y="78" class="t sub">the reconstruction map &#183; twenty-two chapters &#183; every result ships a runnable, dependency-free proof</text>
  <text x="1140" y="54" text-anchor="end" class="t sub">recoveries are labeled recoveries &#183; extensions are labeled extensions</text>
  <text x="1140" y="72" text-anchor="end" class="t sub">scope is printed on every claim</text>

  <!-- top band: the worlds the observer forces -->
  <rect x="60" y="100" width="428" height="78" rx="12" fill="#101d2c" stroke="#5b8fb8" stroke-width="1.6"/>
  <text x="80" y="128" class="t sp">SPACE &#183; Ch 21</text>
  <text x="80" y="147" class="t spb">only the mixed cell can host an asker &#183; locality is what a bounded knower can afford</text>
  <text x="80" y="164" class="t spb">a paid floor can only sparsify &#183; a light cone exists iff the world is sparse</text>

  <rect x="508" y="100" width="428" height="78" rx="12" fill="#101d2c" stroke="#5b8fb8" stroke-width="1.6"/>
  <text x="528" y="128" class="t sp">CHANCE &#183; Ch 22</text>
  <text x="528" y="147" class="t spb">a measure can be shared or affordable, never both &#183; one propagated field serves every seat</text>
  <text x="528" y="164" class="t spb">the limits are forced algebraic numbers &#183; one life reads structure, never weights</text>

  <!-- divergence seam (top right) -->
  <rect x="956" y="100" width="184" height="78" rx="12" fill="#231c10" stroke="#c9a35e" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="972" y="126" class="t dv">THE SEAM &#183; Ch 10&#8211;11</text>
  <text x="972" y="144" class="t dvb">a registered, experiment-open</text>
  <text x="972" y="159" class="t dvb">divergence: &#916;&#8323; &lt; 0 where every</text>
  <text x="972" y="174" class="t dvb">Hilbert space forbids it</text>
  <line x1="1048" y1="98" x2="1048" y2="76" stroke="#c9a35e" stroke-width="2" marker-end="url(#upA)"/>

  <!-- arrows: observers to the forced worlds -->
  <line x1="200" y1="204" x2="200" y2="182" stroke="#5b8fb8" stroke-width="1.8" marker-end="url(#upB)"/>
  <line x1="348" y1="204" x2="348" y2="182" stroke="#5b8fb8" stroke-width="1.8" marker-end="url(#upB)"/>
  <line x1="648" y1="204" x2="648" y2="182" stroke="#5b8fb8" stroke-width="1.8" marker-end="url(#upB)"/>
  <line x1="796" y1="204" x2="796" y2="182" stroke="#5b8fb8" stroke-width="1.8" marker-end="url(#upB)"/>

  <!-- observers layer -->
  <rect x="60" y="206" width="880" height="80" rx="12" fill="#12262e" stroke="#3d7a6e" stroke-width="1.6"/>
  <text x="82" y="234" class="t ob">HOSTED OBSERVERS &#183; Ch 19&#8211;20</text>
  <text x="82" y="254" class="t obb">the interpretation key is a constant of the world &#183; participation is key-free &#183; silence informs &#183; no Rashomon</text>
  <text x="82" y="271" class="t obb">teaching is measurement &#183; overlap redirects agreement from the pair to the world &#183; every knowing is participation or convention</text>

  <!-- the seam's channel: straight from the counting grammar, past every layer -->
  <line x1="1048" y1="336" x2="1048" y2="182" stroke="#c9a35e" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#upA)"/>

  <!-- arrows: columns to observers layer -->
  <line x1="142" y1="336" x2="142" y2="290" stroke="#3d7a6e" stroke-width="1.8" marker-end="url(#upT)"/>
  <line x1="322" y1="336" x2="322" y2="290" stroke="#3d7a6e" stroke-width="1.8" marker-end="url(#upT)"/>
  <line x1="502" y1="336" x2="502" y2="290" stroke="#3d7a6e" stroke-width="1.8" marker-end="url(#upT)"/>
  <line x1="682" y1="336" x2="682" y2="290" stroke="#3d7a6e" stroke-width="1.8" marker-end="url(#upT)"/>
  <line x1="862" y1="336" x2="862" y2="290" stroke="#3d7a6e" stroke-width="1.8" marker-end="url(#upT)"/>

  <!-- six line-columns -->
  <!-- 1 quantum axis -->
  <rect x="60" y="340" width="164" height="240" rx="12" fill="#131f33" stroke="#2c3e5c" stroke-width="1.4"/>
  <text x="76" y="369" class="t h">The quantum axis</text>
  <text x="76" y="387" class="t s">Chapters 1&#8211;2, 8</text>
  <text x="76" y="415" class="t b">one-use counting</text>
  <text x="76" y="435" class="t b">rational Born weights</text>
  <text x="76" y="455" class="t b">CHSH boundary at 2&#8730;2</text>
  <text x="76" y="475" class="t b">carrier grammar</text>
  <text x="76" y="495" class="t b">exact contextual gap</text>
  <text x="76" y="515" class="t b">finite Gleason &#183; 24-cell</text>

  <!-- 2 epistemics -->
  <rect x="240" y="340" width="164" height="240" rx="12" fill="#131f33" stroke="#2c3e5c" stroke-width="1.4"/>
  <text x="256" y="369" class="t h">Finite epistemics</text>
  <text x="256" y="387" class="t s">Chapters 3&#8211;6</text>
  <text x="256" y="415" class="t b">identifiability &amp; debt</text>
  <text x="256" y="435" class="t b">the inquiry calculus</text>
  <text x="256" y="455" class="t b">four time theorems</text>
  <text x="256" y="475" class="t b">no global now</text>
  <text x="256" y="495" class="t b">a measured floor</text>

  <!-- 3 interface -->
  <rect x="420" y="340" width="164" height="240" rx="12" fill="#131f33" stroke="#2c3e5c" stroke-width="1.4"/>
  <text x="436" y="369" class="t h">The interface</text>
  <text x="436" y="387" class="t s">Chapters 8&#8211;9, 13</text>
  <text x="436" y="415" class="t b">non-exact return</text>
  <text x="436" y="435" class="t b">retention forces &#8461;</text>
  <text x="436" y="455" class="t b">the 1+3 split</text>
  <text x="436" y="475" class="t b">E&#8328;&#8211;hexacode weave</text>
  <text x="436" y="495" class="t b">world-phase: received</text>

  <!-- 4 atlas + ladder -->
  <rect x="600" y="340" width="164" height="240" rx="12" fill="#131f33" stroke="#2c3e5c" stroke-width="1.4"/>
  <text x="616" y="369" class="t h">Atlas &amp; ladder</text>
  <text x="616" y="387" class="t s">Chapters 14&#8211;15</text>
  <text x="616" y="415" class="t b">capability cells</text>
  <text x="616" y="435" class="t b">arrow &#8594; now &#8594; retention</text>
  <text x="616" y="455" class="t b">&#8594; associator &#8594; H&#8308;=u&#8322;&#178;</text>
  <text x="616" y="475" class="t b">boundary pinning</text>
  <text x="616" y="495" class="t b">the trine, explained</text>

  <!-- 5 counting grammar -->
  <rect x="780" y="340" width="164" height="240" rx="12" fill="#131f33" stroke="#2c3e5c" stroke-width="1.4"/>
  <text x="796" y="369" class="t h">Counting grammar</text>
  <text x="796" y="387" class="t s">Chapters 12, 18</text>
  <text x="796" y="415" class="t b">exact count regions</text>
  <text x="796" y="435" class="t b">emergent qubit at 5</text>
  <text x="796" y="455" class="t b">forced qutrit at 6</text>
  <text x="796" y="475" class="t b">the exposure law</text>
  <text x="796" y="495" class="t b">width, not depth</text>

  <!-- 6 ledger -->
  <rect x="960" y="340" width="180" height="240" rx="12" fill="#131f33" stroke="#2c3e5c" stroke-width="1.4"/>
  <text x="976" y="369" class="t h">The ledger frame</text>
  <text x="976" y="387" class="t s">Chapters 16&#8211;17</text>
  <text x="976" y="415" class="t b">mint = bill</text>
  <text x="976" y="435" class="t b">no theft, only waste</text>
  <text x="976" y="455" class="t b">the Cut, flow-typed</text>
  <text x="976" y="475" class="t b">constants: column two</text>
  <text x="976" y="495" class="t b">the two bills</text>

  <!-- footnote strip -->
  <text x="600" y="612" text-anchor="middle" class="t s">recoveries of known structure are wins &#183; the one extension is fenced, preregistered, and waiting for an experiment</text>

  <!-- arrows: floor to columns -->
  <line x1="142" y1="652" x2="142" y2="624" stroke="#41546f" stroke-width="1.8" marker-end="url(#up)"/>
  <line x1="322" y1="652" x2="322" y2="624" stroke="#41546f" stroke-width="1.8" marker-end="url(#up)"/>
  <line x1="502" y1="652" x2="502" y2="624" stroke="#41546f" stroke-width="1.8" marker-end="url(#up)"/>
  <line x1="682" y1="652" x2="682" y2="624" stroke="#41546f" stroke-width="1.8" marker-end="url(#up)"/>
  <line x1="862" y1="652" x2="862" y2="624" stroke="#41546f" stroke-width="1.8" marker-end="url(#up)"/>
  <line x1="1050" y1="652" x2="1050" y2="624" stroke="#41546f" stroke-width="1.8" marker-end="url(#up)"/>

  <!-- the floor -->
  <rect x="60" y="654" width="1080" height="84" rx="12" fill="#15253f" stroke="#3f5f8f" stroke-width="1.6"/>
  <text x="82" y="686" class="t fl">THE FLOOR</text>
  <text x="82" y="710" class="t flb">marks made once &#183; a tolerance that stages forks &#183; no law selects the outcome &#8212; staging is now a theorem; the refusal to select is the one named postulate</text>
  <text x="1118" y="686" text-anchor="end" class="t flb">no Hilbert space granted</text>
  <text x="1118" y="710" text-anchor="end" class="t flb">no probability &#183; no continuum</text>
</svg>
