<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The finite-contact reconstruction: one one-use floor, three published lines, ending in the Chapter 8 state/receiver closure where the Born rule and contextuality meet.">
  <style>
    .bg{fill:#ffffff}
    .ink{fill:#111418}
    .mut{fill:#5b6470}
    .card{fill:#f4f6f8;stroke:#c6ccd4;stroke-width:1.2}
    .q{fill:#e6f0fb;stroke:#0b5cad;stroke-width:1.2}
    .e{fill:#e6f4ee;stroke:#0b6b52;stroke-width:1.2}
    .c{fill:#f1e9f9;stroke:#7a3fb0;stroke-width:1.2}
    .edge{stroke:#c6ccd4;stroke-width:1.5;fill:none}
    .floor{fill:#1f2937}
    .ftext{fill:#f7fafc}
    .tag{font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}.ink{fill:#e6edf3}.mut{fill:#9aa5b1}
      .card{fill:#161b22;stroke:#30363d}
      .q{fill:#10233a;stroke:#5aa9f0}.e{fill:#0f2a22;stroke:#3fbf98}.c{fill:#241733;stroke:#c194e6}
      .edge{stroke:#30363d}.floor{fill:#e6edf3}.ftext{fill:#0d1117}
    }
  </style>
  <rect class="bg" x="0" y="0" width="900" height="560"/>
  <text class="ink" x="40" y="42" font-size="23" font-weight="700">Finite Contact Theory — the reconstruction</text>
  <text class="mut" x="40" y="66" font-size="13.5">One one-use floor. Three published lines. Each rung is a runnable theorem, a named recovery, a scoped model result, or a logged failure.</text>

  <!-- floor -->
  <rect class="floor" x="330" y="92" width="240" height="46" rx="10"/>
  <text x="450" y="114" text-anchor="middle" font-size="15" font-weight="700" class="ftext">finite one-use contact floor</text>
  <text x="450" y="131" text-anchor="middle" font-size="10.5" class="ftext" opacity="0.82">a mark, made once, leaving a difference it cannot erase</text>

  <path class="edge" d="M450,138 L165,170"/>
  <path class="edge" d="M450,138 L450,170"/>
  <path class="edge" d="M450,138 L735,170"/>

  <!-- three lines -->
  <rect class="q" x="40" y="172" width="250" height="150" rx="10"/>
  <text class="ink tag" x="56" y="196" font-size="13.5">Quantum-facing axis</text>
  <text class="mut" x="56" y="216" font-size="11">counting · one-receiver gluing</text>
  <text class="mut" x="56" y="233" font-size="11">rational Born weights</text>
  <text class="mut" x="56" y="250" font-size="11">CHSH/Pell boundary → 2√2</text>
  <text class="mut" x="56" y="267" font-size="11">native carrier grammar</text>
  <text class="mut" x="56" y="284" font-size="11">exact preparation gap</text>
  <text class="mut" x="56" y="309" font-size="10">Chapters 1–2 · THEOREM (scoped)</text>

  <rect class="e" x="325" y="172" width="250" height="150" rx="10"/>
  <text class="ink tag" x="341" y="196" font-size="13.5">Finite-epistemics axis</text>
  <text class="mut" x="341" y="216" font-size="11">identifiability &amp; ⌈log₂m⌉ debt</text>
  <text class="mut" x="341" y="233" font-size="11">inquiry calculus · EC=H+KL+O</text>
  <text class="mut" x="341" y="250" font-size="11">four theorems on time</text>
  <text class="mut" x="341" y="267" font-size="11">no derivable “now”</text>
  <text class="mut" x="341" y="284" font-size="11">a measured generative floor</text>
  <text class="mut" x="341" y="309" font-size="10">Chapters 3–6 · THEOREM / MEASURED</text>

  <rect class="c" x="610" y="172" width="250" height="150" rx="10"/>
  <text class="ink tag" x="626" y="196" font-size="13.5">Contact-interface line</text>
  <text class="mut" x="626" y="216" font-size="11">non-exact return → ℍ receiver</text>
  <text class="mut" x="626" y="233" font-size="11">24-cell ⟷ dual 24-cell</text>
  <text class="mut" x="626" y="250" font-size="11">F₄ closure (|W|=1152)</text>
  <text class="mut" x="626" y="267" font-size="11">forced overlap ratio 1/2</text>
  <text class="mut" x="626" y="284" font-size="11">finite Gleason + triality KS</text>
  <text class="mut" x="626" y="309" font-size="10">Chapter 8 (v0.8) · MODEL-SCOPE</text>

  <path class="edge" d="M735,322 L735,352"/>
  <!-- the closure -->
  <rect class="card" x="230" y="354" width="440" height="86" rx="12"/>
  <text class="ink" x="450" y="382" text-anchor="middle" font-size="14.5" font-weight="700">the state / receiver closure</text>
  <text class="mut" x="450" y="404" text-anchor="middle" font-size="11.5">Born valuation forced by a finite Gleason theorem —</text>
  <text class="mut" x="450" y="421" text-anchor="middle" font-size="11.5">exactly where a triality Kochen-Specker obstruction forbids a global pointing</text>

  <rect class="card" x="150" y="470" width="600" height="52" rx="10" fill="none"/>
  <text class="ink" x="450" y="492" text-anchor="middle" font-size="12.5" font-weight="700">“The valuation is uniquely lawful exactly where a global pointing is impossible.”</text>
  <text class="mut" x="450" y="510" text-anchor="middle" font-size="10.5">Born and contextuality are the two faces of one finite closure. Scope: a real-quantum cell — held open beyond, by name.</text>
</svg>
